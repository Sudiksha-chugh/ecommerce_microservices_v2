name: Phase 17 observability verification
# Draft: registration on the default branch and dispatch require separate authorization.
on:
  workflow_dispatch:
    inputs:
      source_identity:
        description: Approved Phase 17 manifest SHA256
        required: true
        type: string
      expected_commit:
        description: Approved verification commit full SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: phase17-dedicated-verification
  cancel-in-progress: false
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PHASE17_SOURCE_IDENTITY: ${{ inputs.source_identity }}
      PHASE17_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Immutable source, readiness, five proofs, performance, independent full runs
        run: node scripts/verify-phase17.mjs
        env:
          PHASE17_EVIDENCE_DIR: ${{ runner.temp }}/phase17-evidence
      - name: Retain only bounded result summaries and sanitized proof/performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase17-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase17-evidence/stage-results.json
            ${{ runner.temp }}/phase17-evidence/static/static.json
            ${{ runner.temp }}/phase17-evidence/live/flow-proof.json
            ${{ runner.temp }}/phase17-evidence/live/result.json
            ${{ runner.temp }}/phase17-evidence/live/performance/performance.json
          if-no-files-found: warn
          retention-days: 7
