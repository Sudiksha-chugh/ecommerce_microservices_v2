name: Phase 16 dedicated verification
# Draft only. A branch checkout cannot verify the current uncommitted snapshot.
on:
  workflow_dispatch:
    inputs:
      source_identity:
        description: SHA256 identity of the authorized source manifest in this checkout
        required: true
        type: string
      expected_commit:
        description: Full SHA of the separately approved verification commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: phase16-dedicated-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PHASE16_SOURCE_IDENTITY: ${{ inputs.source_identity }}
      PHASE16_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify authorized source and ordered gates
        env:
          PHASE16_EVIDENCE_DIR: ${{ runner.temp }}/phase16-evidence
        run: node scripts/verify-phase16.mjs
      - name: Sanitize retained evidence
        if: always()
        env:
          PHASE16_EVIDENCE_DIR: ${{ runner.temp }}/phase16-evidence
          PHASE16_SANITIZED_DIR: ${{ runner.temp }}/phase16-sanitized
        run: node scripts/verify-phase16.mjs --sanitize-only
      - name: Retain independent evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase16-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase16-sanitized/**/*.json
            ${{ runner.temp }}/phase16-sanitized/**/*.jsonl
          if-no-files-found: warn
          retention-days: 7
