# Disposable regression stores and Node 24 runner share one network namespace.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: notification_test_admin
      POSTGRES_PASSWORD: isolated_regression_admin_only
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:0:5432", "127.0.0.1:0:5672", "127.0.0.1:0:15672", "127.0.0.1:0:6379", "127.0.0.1:0:5441", "127.0.0.1:0:9200"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_test_admin -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.2-management
    network_mode: service:postgres
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      RABBITMQ_DEFAULT_USER: stabilization_admin
      RABBITMQ_DEFAULT_PASS: isolated_regression_broker_only
      RABBITMQ_DEFAULT_VHOST: commerce_test
    user: "999:999"
    tmpfs: ["/var/lib/rabbitmq:uid=999,gid=999,mode=0700"]
    healthcheck:
      test: ["CMD", "bash", "-ec", "auth=$$(printf \"%s:%s\" \"$$RABBITMQ_DEFAULT_USER\" \"$$RABBITMQ_DEFAULT_PASS\" | base64 -w0); exec 3<>/dev/tcp/127.0.0.1/15672; printf \"GET /api/overview HTTP/1.1\\r\\nHost: localhost\\r\\nAuthorization: Basic %s\\r\\nConnection: close\\r\\n\\r\\n\" \"$$auth\" >&3; IFS= read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:8
    network_mode: service:postgres
    depends_on:
      postgres: {condition: service_healthy}
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  test-runner:
    profiles: [runner]
    build:
      context: ../..
      dockerfile: infrastructure/docker/integration-test.Dockerfile
    network_mode: service:postgres
    working_dir: /app
    environment:
      INTEGRATION_ENV_DIR: /integration-env
      INTEGRATION_SEARCH_STORES: "true"
      NOTIFICATION_TEST_ADMIN_URL: postgresql://notification_test_admin:isolated_regression_admin_only@127.0.0.1:5432/postgres
    volumes:
      - ${INTEGRATION_ENV_DIRECTORY:-/tmp/unconfigured-integration-env}:/integration-env:ro
      - ${INTEGRATION_OUTPUT_DIR:-/tmp/unconfigured-integration-output}:/integration-output
    entrypoint: [node]
  search-postgres:
    image: postgres:17
    network_mode: service:postgres
    depends_on:
      postgres: {condition: service_healthy}
    command: [postgres, -p, "5441"]
    environment: {POSTGRES_USER: search_test_admin, POSTGRES_PASSWORD: isolated_search_only, POSTGRES_DB: postgres, PGPORT: "5441"}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, search_test_admin, -d, postgres, -p, "5441"]
      interval: 2s
      timeout: 5s
      retries: 30
  search-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    network_mode: service:postgres
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 768m
    cpus: 2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      xpack.watcher.enabled: "false"
      xpack.profiling.enabled: "false"
      xpack.apm_data.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      node.roles: '[master,data,ingest]'
      node.processors: '2'
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m -XX:TieredStopAtLevel=1
      action.auto_create_index: "false"
    tmpfs: ["/usr/share/elasticsearch/data:uid=1000,gid=0,mode=0770"]
